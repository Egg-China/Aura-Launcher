name: Java CI

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '17'
          java-package: jdk+fx
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          cache-cleanup: never
      - name: Verify xvfb
        run: command -v xvfb-run
      - name: Build and test
        run: xvfb-run -a ./gradlew build --no-daemon --parallel --stacktrace
        env:
          MICROSOFT_AUTH_ID: ${{ secrets.CLIENT_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      - name: Upload launcher artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Aura-Launcher-${{ github.sha }}
          path: |
            AuraLauncher/build/libs/Aura-Launcher-*.jar*
            AuraLauncher/build/libs/Aura-Launcher-*.exe*
            AuraLauncher/build/libs/Aura-Launcher-*.sh*
            AuraLauncher/build/libs/Aura-Launcher-*.deb*
          if-no-files-found: error
